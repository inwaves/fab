[project]
name = "fab"
version = "0.1.0"
description = "Research protocol skeleton for agent-driven alignment work."
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
# Everything needed to run the test suite. Install with:
#   uv pip install -e ".[dev]"
dev = ["pytest>=8"]

[project.scripts]
fab = "fab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `fab` lives under src/ and the `services` sidecar lives at the repo root, so
# both are put on sys.path for collection. This makes `pytest` work whether or
# not the project has been installed into the environment.
testpaths = ["tests"]
pythonpath = ["src", "."]
